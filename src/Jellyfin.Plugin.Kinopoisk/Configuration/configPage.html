<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>КиноПоиск</title>
</head>
<body>
    <div id="KinopoiskConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="KinopoiskConfigForm">
                    <div class="inputContainer">
                        <label class="inputeLabel inputLabelUnfocused" for="ApiToken">ApiToken</label>
                        <input id="ApiToken" name="ApiToken" type="text" is="emby-input" />
                        <div class="fieldDescription">Personal api token, you can get your own on
                            <a href="https://kinopoiskapiunofficial.tech">https://kinopoiskapiunofficial.tech</a>
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputeLabel inputLabelUnfocused" for="CacheDays">Кэш ответов API, дней</label>
                        <input id="CacheDays" name="CacheDays" type="number" min="0" is="emby-input" />
                        <div class="fieldDescription">Ответы по фильмам, актёрам и трейлерам хранятся на диске:
                            повторное обновление метаданных не тратит дневную квоту API. 0 - не кэшировать.
                        </div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="LoadStaff" name="LoadStaff" type="checkbox" is="emby-checkbox" />
                            <span>Загружать актёров и съёмочную группу</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Один запрос к API на фильм / сериал.</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="LoadTrailers" name="LoadTrailers" type="checkbox" is="emby-checkbox" />
                            <span>Загружать трейлеры</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Один запрос к API на фильм / сериал.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var KinopoiskPluginConfig = {
                pluginUniqueId: '33e6d249-648f-44cd-a9ce-497be06c08df'
            };

            $('#KinopoiskConfigPage').on('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(KinopoiskPluginConfig.pluginUniqueId).then(function (config) {
                    $('#ApiToken').val(config.ApiToken).change();
                    $('#CacheDays').val(config.CacheDays).change();
                    $('#LoadStaff').prop('checked', config.LoadStaff);
                    $('#LoadTrailers').prop('checked', config.LoadTrailers);
                    Dashboard.hideLoadingMsg();
                });
            });

            $('#KinopoiskConfigForm').on('submit', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(KinopoiskPluginConfig.pluginUniqueId).then(function (config) {
                    config.ApiToken = $('#ApiToken').val();
                    config.CacheDays = Math.max(0, parseInt($('#CacheDays').val(), 10) || 0);
                    config.LoadStaff = $('#LoadStaff').prop('checked');
                    config.LoadTrailers = $('#LoadTrailers').prop('checked');
                    ApiClient.updatePluginConfiguration(KinopoiskPluginConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                return false;
            });
        </script>
    </div>
</body>
</html>
